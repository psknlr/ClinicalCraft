name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit & integration tests
        run: npm test
      - name: Validate and verify built-in content
        run: npx tsx packages/cli/src/bin.ts cases validate --all && npx tsx packages/cli/src/bin.ts cases verify --all
      - name: Build
        run: npm run build
      - name: Offline autopilot smoke (every case)
        run: npx tsx packages/cli/src/bin.ts eval --cases all --provider offline --out eval-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval-report.md

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CLINICALCRAFT_E2E_CHROMIUM: playwright
