name: CI

on:
  push:
    # Feature branches get a measured run too (the implementation branch had never been built by CI).
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit & integration tests
        run: npm test
      # `npm run cc` runs every workspace package from source (the "source" export condition): no build needed.
      - name: Validate and verify built-in content
        run: npm run -s cc -- cases validate --all && npm run -s cc -- cases verify --all
      - name: Build
        run: npm run build
      - name: Offline autopilot smoke (every case, built binary)
        run: node packages/cli/dist/bin.js eval --cases all --provider offline --out eval-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval-report.md

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          # Read by packages/web/playwright.config.ts: use the browser `playwright install` just fetched.
          CLINICALCRAFT_E2E_CHROMIUM: playwright
